name: bench

on:
  workflow_dispatch:
    inputs:
      size_gb:
        description: backing image size (GiB)
        default: "6"

jobs:
  fio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fio and FUSE
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fio fuse3 e2fsprogs
      - name: Build
        run: go build -o walfs ./cmd/walfs
      - name: Describe machine
        run: |
          uname -a; nproc; free -g | head -2; df -h "$RUNNER_TEMP" | tail -1; fio --version
      - name: Benchmark walfs (ordered journal) over FUSE
        run: |
          set -e
          IMG=$RUNNER_TEMP/walfs.img; MNT=$RUNNER_TEMP/mnt-walfs; mkdir -p $MNT results
          ./walfs mkfs -size ${{ inputs.size_gb }}G $IMG
          ./walfs mount -journal ordered $MNT $IMG & sleep 2
          mountpoint $MNT
          scripts/bench.sh walfs-ordered $MNT results
          fusermount3 -u $MNT; wait
          ./walfs fsck $IMG
          rm -f $IMG
      - name: Benchmark walfs (data journal) over FUSE
        run: |
          set -e
          IMG=$RUNNER_TEMP/walfs.img; MNT=$RUNNER_TEMP/mnt-walfs; mkdir -p $MNT
          ./walfs mkfs -size ${{ inputs.size_gb }}G $IMG
          ./walfs mount -journal data $MNT $IMG & sleep 2
          scripts/bench.sh walfs-data $MNT results
          fusermount3 -u $MNT; wait
          ./walfs fsck $IMG
          rm -f $IMG
      - name: Benchmark walfs (ordered) with an active snapshot, and snapshot cost
        run: |
          set -e
          IMG=$RUNNER_TEMP/walfs.img; MNT=$RUNNER_TEMP/mnt-walfs; mkdir -p $MNT
          ./walfs mkfs -size ${{ inputs.size_gb }}G $IMG
          ./walfs mount -journal ordered $MNT $IMG & sleep 2
          # Populate ~1.5 GiB so that creation time can be seen to be independent of data size.
          mkdir $MNT/pre && for i in 1 2 3; do dd if=/dev/urandom of=$MNT/pre/f$i bs=1M count=512 status=none; done
          sync; sleep 6
          cow() { fio --name=$1 --filename=$MNT/pre/f1 --rw=randwrite --bs=4k --size=512M --ioengine=psync \
                    --numjobs=1 --randrepeat=0 --time_based --runtime=15 --end_fsync=1 \
                    --output-format=json --output=cow-$1.json >/dev/null; python3 scripts/fio_iops.py cow-$1.json; }
          used() { df -B1M --output=used $MNT | tail -1 | tr -d ' '; }
          echo "4 KiB random overwrites of existing data, no snapshot:        $(cow base)" | tee snapcost.txt
          sync; sleep 6
          t0=$(date +%s%N); mkdir $MNT/.snapshots/bench; t1=$(date +%s%N)
          echo "snapshot create on ~1.5 GiB of data: $(( (t1-t0)/1000000 )) ms" | tee -a snapcost.txt
          u0=$(used)
          echo "same overwrites with a snapshot (every first touch copies):   $(cow first)" | tee -a snapcost.txt
          u1=$(used)
          echo "space preserved for the snapshot by those overwrites: $((u1-u0)) MiB" | tee -a snapcost.txt
          echo "same overwrites again (most blocks already copied):           $(cow second)" | tee -a snapcost.txt
          scripts/bench.sh walfs-ordered-snap $MNT results
          # Deleting the snapshot returns the space preserved while the benchmark ran.
          u2=$(used)
          t0=$(date +%s%N); rmdir $MNT/.snapshots/bench; t1=$(date +%s%N)
          echo "snapshot delete (after $((u2-u0)) MiB were preserved under it): $(( (t1-t0)/1000000 )) ms" | tee -a snapcost.txt
          sync; sleep 2
          echo "space returned by deleting the snapshot: $((u2 - $(used))) MiB" | tee -a snapcost.txt
          fusermount3 -u $MNT; wait
          ./walfs fsck $IMG
          rm -f $IMG
      - name: Benchmark ext4 (loop device, same backing storage)
        run: |
          set -e
          IMG=$RUNNER_TEMP/ext4.img; MNT=$RUNNER_TEMP/mnt-ext4; mkdir -p $MNT
          truncate -s ${{ inputs.size_gb }}G $IMG
          mkfs.ext4 -q -F $IMG
          sudo mount -o loop $IMG $MNT; sudo chown $USER $MNT
          scripts/bench.sh ext4 $MNT results
          sudo umount $MNT; rm -f $IMG
      - name: Benchmark tmpfs
        run: |
          set -e
          MNT=$RUNNER_TEMP/mnt-tmpfs; mkdir -p $MNT
          sudo mount -t tmpfs -o size=3g tmpfs $MNT; sudo chown $USER $MNT
          scripts/bench.sh tmpfs $MNT results
          sudo umount $MNT
      - name: Summarise
        run: |
          python3 scripts/summarize.py results | tee summary.md
          cat snapcost.txt >> "$GITHUB_STEP_SUMMARY"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fio-results
          path: |
            results
            summary.md
            snapcost.txt
            cow-*.json
