name: fuse

on:
  push:
  workflow_dispatch:

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - run: go build -o walfs ./cmd/walfs
      - name: Mount smoke test
        run: |
          set -x
          BIN=$PWD/walfs
          $BIN mkfs -size 256M /tmp/s.img
          mkdir /tmp/m && $BIN mount /tmp/m /tmp/s.img 2>/tmp/daemon.log & sleep 2
          cd /tmp/m
          mkdir -p a/b && echo hello > a/b/f && ln a/b/f a/hard && mv a/b/f a/b/g && ln -s b/g a/sym
          echo "--- small listing:"; ls -la a; echo "ls exit: $?"
          test "$(cat a/hard)" = hello && test "$(cat a/sym)" = hello && test "$(readlink a/sym)" = b/g
          test "$(stat -c %h a/hard)" = 2
          dd if=/dev/urandom of=big bs=1M count=64 status=none
          sha256sum big > big.sum && sync && sha256sum -c big.sum
          truncate -s 1M big && test "$(stat -c %s big)" = 1048576
          fallocate -n -o 0 -l 8M big && fallocate -p -n -o 4096 -l 8192 big
          for i in $(seq 500); do echo $i > a/file$i; done
          echo "--- big listing:"; ls a | head -3; ls a 2>&1 >/dev/null | head; ls a | wc -l; python3 -c "import os; print(len(os.listdir('a')))"
          cat /tmp/daemon.log | tail -5
          test "$(ls a | wc -l)" = 503
          rm -r a && ls -la && df -h .
          cd / && fusermount3 -u /tmp/m && wait
          $BIN fsck /tmp/s.img
      - name: kill -9 recovery on a live mount (ordered)
        run: scripts/kill9_test.sh ./walfs 25 ordered
      - name: kill -9 recovery on a live mount (data)
        run: scripts/kill9_test.sh ./walfs 15 data
